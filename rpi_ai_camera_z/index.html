<!doctype html>
<html><head><meta charset='utf-8'><title>AI Camera Stream</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#111; font-family:sans-serif; color:#eee; }
  #header { 
    padding:12px; background:#222; display:flex; align-items:center; 
    justify-content:space-between; gap:12px; border-bottom:2px solid #444;
  }
  #status { font-weight:bold; font-size:16px; min-width:200px; }
  #controls { display:flex; gap:8px; flex-wrap:wrap; }
  button {
    padding:8px 14px; font-weight:bold; border:0; border-radius:4px; 
    cursor:pointer; font-size:14px; transition:all 0.2s;
  }
  button:hover { transform:scale(1.05); }
  .btn-primary { background:#2a2; color:#fff; }
  .btn-danger { background:#c22; color:#fff; }
  .btn-secondary { background:#444; color:#fff; }
  .btn-info { background:#248; color:#fff; }
  #video-container { width:100%; text-align:center; padding:12px; }
  #stream { max-width:100%; max-height:85vh; background:#000; border:1px solid #444; }
  #info { padding:12px; background:#1a1a1a; font-size:12px; }
</style>
</head>
<body>
<div id='header'>
  <span id='status'>Initialization...</span>
  <div id='controls'>
    <button class='btn-primary' onclick="signal('detect_toggle')">
      🎯 Detection: ON
    </button>
    <button class='btn-info' onclick="signal('track_toggle')">
      📍 Tracking: OFF
    </button>
    <button class='btn-secondary' onclick="signal('fps_reset')">
      📊 Reset FPS
    </button>
    <button class='btn-danger' onclick="if(confirm('Shutdown?')) signal('quit')">
      ❌ Quit
    </button>
  </div>
</div>
<div id='video-container'>
  <img id='stream' src='/stream.mjpg' 
       style='width:100%; border:1px solid #555;'>
</div>
<div id='info'>
  <p>AI Camera Stream | Camera: cam/disp1 | Detection: YOLOv8</p>
</div>
<script>
  function signal(name) {
    fetch('/signal/' + name).catch(console.error);
  }
  setInterval(() => {
    fetch('/status').then(r => r.json()).then(d => {
      document.getElementById('status').textContent = d.status;
    }).catch(console.error);
  }, 1000);
</script>
</body>
</html>
